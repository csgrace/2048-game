name: AI Validation v1

on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Fixed-seed validation games (default is the v1 comparison set)'
        required: false
        default: '50'
        type: string

permissions:
  contents: write

concurrency:
  group: ai-training-v1
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install validation dependencies
        run: pip install -r requirements.txt

      - name: Evaluate the published v1 checkpoint
        run: python scripts/validate_policy_value.py --games ${{ inputs.games }} --seed 10000

      - name: Commit validation progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/ai-playtest-progress.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(ai): record fixed-seed v1 validation [skip ci]"
          git push
