name: AI Training v1

on:
  # A commit explicitly tagged [train-v1] starts/resumes the chunk loop.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: ai-training-v1
  cancel-in-progress: false

jobs:
  train-chunks:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[train-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install trainer dependencies
        run: pip install -r requirements.txt

      - name: Train and persist one 10-game checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/train_policy_value_chunk.py --games 10 --target-games 250 --epochs 2 --seed 2048 --full-validation-every 50 --validation-games 50
          git add js/ai-training-candidate.json js/ai-training-progress.json js/ai-backend-status.json js/ai-weights.json js/ai-best-checkpoint.json
          if git diff --staged --quiet; then
            echo "No checkpoint changes; training target has already been reached."
            exit 0
          fi
          git commit -m "chore(ai): checkpoint v1 training [skip ci]"
          git push
          if python -c "import json; raise SystemExit(0 if json.load(open('js/ai-training-progress.json'))['active'] else 1)"; then
            echo "Checkpoint complete; dispatching the next independent 10-game run."
            gh workflow run ai-train.yml --ref main
          else
            echo "Training target reached."
          fi
