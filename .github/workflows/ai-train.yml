name: AI Training v1

on:
  # A commit explicitly tagged [train-v1] bootstraps the first 10-game chunk.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-training-v1
  cancel-in-progress: false

jobs:
  train-chunk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[train-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install trainer dependencies
        run: pip install -r requirements.txt

      - name: Train exactly one 10-game resumable chunk
        run: python scripts/train_policy_value_chunk.py --games 10 --target-games 250 --epochs 2 --seed 2048 --full-validation-every 50 --validation-games 50

      - name: Commit and push this checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/ai-training-candidate.json js/ai-training-progress.json js/ai-weights.json js/ai-best-checkpoint.json
          git diff --staged --quiet && echo "No checkpoint changes" && exit 0
          git commit -m "chore(ai): checkpoint v1 training chunk [skip ci]"
          git push
