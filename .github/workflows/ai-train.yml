name: AI Training v1

on:
  # A commit explicitly tagged [train-v1] can bootstrap a run without exposing an API token.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      games:
        description: 'Teacher games for the reproducible v1 run'
        required: false
        default: '250'
        type: string
      epochs:
        description: 'Training epochs'
        required: false
        default: '8'
        type: string

permissions:
  contents: write

concurrency:
  group: ai-training-v1
  cancel-in-progress: true

jobs:
  train:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[train-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install trainer dependencies
        run: pip install -r requirements.txt

      - name: Train v1 and retain fixed-seed best checkpoint
        run: python scripts/train_policy_value.py --games ${{ inputs.games || '250' }} --epochs ${{ inputs.epochs || '8' }} --seed 2048 --validation-games 50

      - name: Commit v1 weights and validation record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/ai-weights.json js/ai-best-checkpoint.json js/ai-training-progress.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(ai): publish reproducible v1 checkpoint [skip ci]"
          git push
