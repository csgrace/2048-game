name: AI Training

on:
  # 手动触发（在 GitHub 仓库 Actions 页面点 "Run workflow"）
  workflow_dispatch:
    inputs:
      games:
        description: 'Number of games to train'
        required: false
        default: '100'
        type: string

permissions:
  contents: write  # 需要 push 权限来更新 ai-weights.json 和 ai-training-progress.json

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run AI training
        run: node scripts/train-ai.js --games ${{ github.event.inputs.games || '100' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated weights (fallback if script didn't)
        run: |
          git add js/ai-weights.json js/ai-training-progress.json 2>/dev/null || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(ai): update trained weights via GitHub Actions [skip ci]"
          git push
