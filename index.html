<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2048 – CS109 Project</title>
<style>
/* ------------------------------------------------------------------ reset */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --c-empty:      #cdc1b4;
  --c-board:      #bbada0;
  --c-bg-top:     #0f1428;
  --c-bg-bot:     #321e50;
  --c-text-dark:  #776e65;
  --c-text-light: #f9f6f2;
  --c-accent:     #8f7a66;
  --c-accent-h:   #a59178;
  --radius:       14px;
}

html, body { height: 100%; }

body {
  font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
  color: var(--c-text-light);
  background: linear-gradient(135deg, var(--c-bg-top), var(--c-bg-bot));
  overflow-x: hidden;
  position: relative;
}

/* floating decorative dots */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0;
  background-image:
    radial-gradient(circle at 12% 20%, rgba(255,255,255,.08) 0 3px, transparent 4px),
    radial-gradient(circle at 78% 60%, rgba(255,255,255,.05) 0 2px, transparent 3px),
    radial-gradient(circle at 40% 85%, rgba(255,255,255,.06) 0 2.5px, transparent 3.5px),
    radial-gradient(circle at 90% 10%, rgba(255,255,255,.07) 0 2px, transparent 3px);
  pointer-events: none;
}

.app { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 16px; }

/* ---------------------------------------------------------------- screens */
.screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 560px; }
.screen.active { display: flex; }

/* ---------------------------------------------------------------- entry */
.title-big { font-size: clamp(48px, 10vw, 72px); font-weight: 800; color: #f9f6f2; letter-spacing: 2px; }
.subtitle  { font-size: 16px; color: rgba(255,255,255,.75); margin: 8px 0 36px; }

.card-pick {
  display: flex; gap: 18px; flex-wrap: wrap; justify-content: center;
}
.pick {
  width: 200px; padding: 28px 16px; text-align: center;
  background: var(--c-accent); color: #fff; border-radius: var(--radius);
  cursor: pointer; transition: all .18s ease;
  border: none; font-size: 18px; font-weight: 700;
}
.pick .icon { font-size: 38px; display: block; margin-bottom: 8px; }
.pick small  { display: block; font-weight: 400; opacity: .85; font-size: 13px; margin-top: 6px; }
.pick:hover { background: var(--c-accent-h); transform: translateY(-3px); }

/* ---------------------------------------------------------------- auth */
.auth-box { width: 100%; max-width: 360px; }
.auth-box label { display: block; margin: 10px 0 4px; font-size: 14px; color: rgba(255,255,255,.85); }
.auth-box input {
  width: 100%; padding: 10px 14px; font-size: 15px; border-radius: 8px; border: none;
  outline: none;
}
.btn-row { display: flex; gap: 8px; margin-top: 18px; }
.btn {
  flex: 1; padding: 10px; border: none; border-radius: 8px;
  background: var(--c-accent); color: #fff; font-weight: 700; cursor: pointer;
  font-size: 14px; transition: background .15s;
}
.btn:hover  { background: var(--c-accent-h); }
.btn.ghost  { background: rgba(255,255,255,.15); }
.btn.ghost:hover { background: rgba(255,255,255,.25); }
.status-msg { margin-top: 12px; font-size: 13px; color: #ffaaaa; min-height: 18px; }

/* ---------------------------------------------------------------- game */
#game-screen { max-width: 620px; }
.top-bar { display: flex; align-items: center; gap: 16px; width: 100%; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; }
.who  { font-weight: 700; font-size: 15px; }
.stat {
  background: rgba(255,255,255,.12); padding: 6px 14px; border-radius: 20px;
  font-weight: 700; font-size: 14px; min-width: 90px; text-align: center;
}

.board-wrap { position: relative; }
#board {
  display: grid;
  grid-template-columns: repeat(4, var(--tile-size, 100px));
  grid-template-rows:    repeat(4, var(--tile-size, 100px));
  gap: 10px; padding: 12px;
  background: var(--c-board); border-radius: 12px;
}
#board .cell {
  width: var(--tile-size,100px); height: var(--tile-size,100px);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: clamp(28px, 5vw, 40px);
  border-radius: 8px; transition: transform .12s ease;
}

.sides { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
.sides .btn { min-width: 80px; }

.arrows {
  display: grid; grid-template-columns: repeat(3, 46px);
  grid-template-rows: repeat(2, 42px); gap: 4px;
  margin-top: 12px; justify-content: center;
}
.arrows .btn { min-width: 46px; font-size: 18px; padding: 6px; }
.arrows .btn:nth-child(1) { grid-column: 2; grid-row: 1; }
.arrows .btn:nth-child(2) { grid-column: 1; grid-row: 2; }
.arrows .btn:nth-child(3) { grid-column: 2; grid-row: 2; }
.arrows .btn:nth-child(4) { grid-column: 3; grid-row: 2; }

/* overlay */
#overlay {
  display: none; position: absolute; inset: 0;
  background: rgba(0,0,0,.6); border-radius: 12px; z-index: 5;
  align-items: center; justify-content: center; flex-direction: column;
  gap: 16px;
}
#overlay.show { display: flex; }
#overlay h2 { color: #fff; font-size: 32px; }

/* leaderboard modal */
.modal {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55);
  z-index: 100; align-items: center; justify-content: center;
}
.modal.show { display: flex; }
.modal-box { background: #faf8ef; color: #333; padding: 24px 28px; border-radius: 12px; min-width: 340px; max-width: 90vw; }
.modal-box h2 { margin-bottom: 12px; text-align: center; color: #776e65; }
.lb-table { width: 100%; border-collapse: collapse; }
.lb-table th, .lb-table td { padding: 6px 10px; text-align: left; font-size: 14px; }
.lb-table th { border-bottom: 2px solid #ccc; }
.lb-table tr:nth-child(even) { background: rgba(0,0,0,.04); }
.modal-close { margin-top: 16px; display: block; width: 100%; padding: 8px; border: none; background: var(--c-accent); color: #fff; font-weight: 700; border-radius: 6px; cursor: pointer; }

@media (max-width: 480px) {
  :root { --tile-size: 80px; }
  .stat { font-size: 12px; min-width: 70px; padding: 5px 10px; }
}
</style>
</head>
<body>

<div class="app">

  <!-- ============ ENTRY ============ -->
  <div class="screen active" id="entry-screen">
    <div class="title-big">2048</div>
    <div class="subtitle">Choose how you want to play</div>
    <div class="card-pick">
      <button class="pick" id="btn-user">
        <span class="icon">👤</span>User Mode
        <small>Save · Compete · Continue later</small>
      </button>
      <button class="pick" id="btn-guest">
        <span class="icon">🎮</span>Guest Mode
        <small>Jump straight in · no sign-up</small>
      </button>
    </div>
  </div>

  <!-- ============ AUTH ============ -->
  <div class="screen" id="auth-screen">
    <div class="title-big" style="font-size:36px;margin-bottom:6px">User Mode</div>
    <div class="subtitle">Log in or register</div>
    <div class="auth-box">
      <label for="auth-user">Username</label>
      <input id="auth-user" type="text" autocomplete="username" placeholder="Enter username" />
      <label for="auth-pass">Password</label>
      <input id="auth-pass" type="password" autocomplete="current-password" placeholder="Enter password" />
      <div class="btn-row">
        <button class="btn" id="btn-login">Login</button>
        <button class="btn" id="btn-register">Register</button>
        <button class="btn ghost" id="btn-auth-back">← Back</button>
      </div>
      <div class="status-msg" id="auth-status"></div>
    </div>
  </div>

  <!-- ============ GAME ============ -->
  <div class="screen" id="game-screen">
    <div class="top-bar">
      <span class="who" id="who-label"></span>
      <span class="stat" id="stat-score">🏆 0</span>
      <span class="stat" id="stat-steps">👣 0</span>
      <span class="stat" id="stat-time">⏱ 00:00</span>
    </div>
    <div class="board-wrap">
      <div id="board"></div>
      <div id="overlay"><h2 id="ov-title"></h2><button class="btn" id="ov-btn">Play Again</button></div>
    </div>
    <div class="sides">
      <button class="btn" id="b-save">💾 Save</button>
      <button class="btn" id="b-load">📂 Load</button>
      <button class="btn" id="b-undo">↩ Undo</button>
      <button class="btn" id="b-restart">↺ Restart</button>
      <button class="btn" id="b-leaderboard">🏆 Boards</button>
    </div>
    <div class="arrows">
      <button class="btn" id="b-up">↑</button>
      <button class="btn" id="b-left">←</button>
      <button class="btn" id="b-down">↓</button>
      <button class="btn" id="b-right">→</button>
    </div>
  </div>

</div>

<!-- leaderboard modal -->
<div class="modal" id="lb-modal">
  <div class="modal-box">
    <h2>🏆 High Scores</h2>
    <table class="lb-table">
      <thead><tr><th>#</th><th>Player</th><th>Score</th><th>Steps</th><th>Time</th></tr></thead>
      <tbody id="lb-body"></tbody>
    </table>
    <button class="modal-close" id="lb-close">Close</button>
  </div>
</div>

<script>
/* ====================================================================
   Persistent key helpers (localStorage)
   ==================================================================== */
const LS_USERS     = 'g2048_users';      // { username: passwordHash }
const LS_COOKIES   = 'g2048_cookies';    // { username: authToken }
const LS_SAVES     = 'g2048_saves';      // { username: GameState }
const LS_LEADER    = 'g2048_leader';     // [{user, score, steps, duration, date}]

const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

/* tiny hash for demo purposes */
async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const h   = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,'0')).join('');
}

/* ====================================================================
   Sound (Web Audio API – no external files needed)
   ==================================================================== */
let audioCtx = null;
function snd(freq, dur = .08, type = 'sine', vol = .15) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch {}
}
const SFX = {
    move:   () => snd(330, .05, 'square', .06),
    merge:  () => snd(660, .12, 'sine',  .18),
    win:    () => { snd(880,.2); setTimeout(()=>snd(1100,.3),120); },
    lose:   () => { snd(220,.2); setTimeout(()=>snd(165,.3),120); },
    button: () => snd(500, .03, 'square', .05),
};

/* ====================================================================
   Tile colours – matches classic 2048 palette
   ==================================================================== */
const BG = {
  0:[205,193,180],2:[238,228,218],4:[237,224,200],8:[242,177,121],
  16:[245,149,99],32:[246,124,95],64:[246,94,59],128:[237,207,114],
  256:[237,204,97],512:[237,200,80],1024:[237,197,63],2048:[237,194,46]
};
function bg(v){ const c = BG[v] || [60,58,50]; return `rgb(${c[0]},${c[1]},${c[2]})`; }
function fg(v){ return v <= 4 ? '#776e65' : '#f9f6f2'; }

/* ====================================================================
   Game state
   ==================================================================== */
const SIZE = 4;
let board       = Array.from({length:SIZE}, () => Array(SIZE).fill(0));
let score       = 0;
let steps       = 0;
let elapsedMs   = 0;
let startTime   = Date.now();
let won         = false;
let over        = false;
const undoStack = [];
const MAX_UNDO  = 30;

let currentUser = null;     // username or null

const $  = id => document.getElementById(id);
const cells = [];

/* ------------------------------------------------------------------ DOM setup (game screen) */

(function buildBoard() {
  const board = $('board');
  for (let r = 0; r < SIZE; r++) { cells[r] = []; for (let c = 0; c < SIZE; c++) {
    const div = document.createElement('div');
    div.className = 'cell';
    board.appendChild(div);
    cells[r][c] = div;
  }}
})();

/* ------------------------------------------------------------------ rendering */

function render() {
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    const v = board[r][c];
    const d = cells[r][c];
    d.textContent = v || '';
    d.style.background = bg(v);
    d.style.color = fg(v);
    d.style.transform = v ? 'scale(1)' : 'scale(0.9)';
  }
  $('stat-score').textContent = '🏆 ' + score;
  $('stat-steps').textContent = '👣 ' + steps;
}

function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}
setInterval(() => {
  if (!over) elapsedMs = Date.now() - startTime;
  $('stat-time').textContent = '⏱ ' + fmtTime(elapsedMs);
}, 500);

/* ------------------------------------------------------------------ game logic */

function emptyCells() {
  const out = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++)
    if (!board[r][c]) out.push([r, c]);
  return out;
}

function addRandom() {
  const e = emptyCells();
  if (!e.length) return;
  const [r, c] = e[Math.floor(Math.random() * e.length)];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function init() {
  board = Array.from({length:SIZE}, () => Array(SIZE).fill(0));
  score = 0; steps = 0; won = false; over = false;
  elapsedMs = 0; startTime = Date.now();
  undoStack.length = 0;
  addRandom(); addRandom(); render();
  hideOverlay();
}

function snapshot() {
  return { board: board.map(r=>[...r]), score, steps, elapsedMs };
}

function slide(line) {
  // compact + merge
  const nz = line.filter(v => v);
  const out = [];
  for (let i = 0; i < nz.length; i++) {
    if (i + 1 < nz.length && nz[i] === nz[i + 1]) {
      out.push(nz[i] * 2);
      score += out[out.length - 1];
      i++;
    } else out.push(nz[i]);
  }
  while (out.length < SIZE) out.push(0);
  return out;
}

function col(c) { return board.map(r => r[c]); }
function setCol(c, arr) { for (let r = 0; r < SIZE; r++) board[r][c] = arr[r]; }

function move(dir) {
  if (over) return;
  const before = JSON.stringify(board);
  undoStack.push(snapshot());
  if (undoStack.length > MAX_UNDO) undoStack.shift();

  if (dir === 'left')  for (let r = 0; r < SIZE; r++) board[r] = slide(board[r]);
  if (dir === 'right') for (let r = 0; r < SIZE; r++) board[r] = slide(board[r].slice().reverse()).reverse();
  if (dir === 'up')    for (let c = 0; c < SIZE; c++) setCol(c, slide(col(c)));
  if (dir === 'down')  for (let c = 0; c < SIZE; c++) setCol(c, slide(col(c).slice().reverse()).reverse());

  if (JSON.stringify(board) !== before) {
    steps++;
    SFX.move();
    addRandom();
    if (!won && board.flat().includes(2048)) {
      won = true; SFX.win();
      setTimeout(() => showOverlay('🎉 You Win!'), 120);
    } else if (!hasMoves()) {
      over = true; SFX.lose();
      recordScore();
      setTimeout(() => showOverlay('💀 Game Over'), 120);
    }
  } else {
    undoStack.pop();  // nothing changed
  }
  render();
}

function hasMoves() {
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    if (!board[r][c]) return true;
    if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) return true;
    if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) return true;
  }
  return false;
}

function undo() {
  if (!undoStack.length) { SFX.lose(); return; }
  const s = undoStack.pop();
  board = s.board.map(r=>[...r]);
  score = s.score; steps = s.steps; elapsedMs = s.elapsedMs;
  over = false; won = false;
  SFX.move(); render(); hideOverlay();
}

/* ------------------------------------------------------------------ leaderboard */

function recordScore() {
  if (!currentUser) return;
  const lb = load(LS_LEADER, []);
  lb.push({ user: currentUser, score, steps, duration: elapsedMs, date: Date.now() });
  lb.sort((a,b) => b.score - a.score || a.duration - b.duration);
  save(LS_LEADER, lb.slice(0, 50));
}

function showLeaderboard() {
  const lb = load(LS_LEADER, []);
  const body = $('lb-body');
  if (!lb.length) {
    body.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:16px">No scores yet – be the first!</td></tr>';
  } else {
    body.innerHTML = lb.slice(0, 15).map((e, i) =>
      `<tr><td>${i+1}</td><td>${escapeHtml(e.user)}</td><td>${e.score}</td><td>${e.steps}</td><td>${fmtTime(e.duration)}</td></tr>`
    ).join('');
  }
  $('lb-modal').classList.add('show');
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

/* ------------------------------------------------------------------ save / load */

function doSave() {
  if (!currentUser) { alert('Saving is only available in User Mode.'); return; }
  const saves = load(LS_SAVES, {});
  saves[currentUser] = snapshot();
  save(LS_SAVES, saves);
  SFX.merge(); alert('✅ Game saved!');
}
function doLoad() {
  if (!currentUser) return;
  const saves = load(LS_SAVES, {});
  if (!saves[currentUser]) { alert('No save found.'); return; }
  const s = saves[currentUser];
  board = s.board.map(r=>[...r]);
  score = s.score; steps = s.steps; elapsedMs = s.elapsedMs;
  startTime = Date.now() - elapsedMs;
  over = false; won = false;
  undoStack.length = 0;
  SFX.merge(); render(); hideOverlay();
  alert('📂 Game loaded!');
}

/* ------------------------------------------------------------------ overlay */

function showOverlay(title) { $('ov-title').textContent = title; $('overlay').classList.add('show'); }
function hideOverlay()      { $('overlay').classList.remove('show');               }

/* ------------------------------------------------------------------ screen switching */

function show(s) {
  document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
  $(s).classList.add('active');
}

/* ====================================================================
   Entry flow
   ==================================================================== */
$('btn-user').onclick  = () => { SFX.button(); show('auth-screen'); };
$('btn-guest').onclick = () => {
  SFX.button(); currentUser = null;
  $('who-label').textContent = '🎮 Guest Mode';
  $('b-save').disabled = true;
  $('b-save').style.opacity = 0.5;
  show('game-screen'); init();
};

/* ====================================================================
   Auth
   ==================================================================== */
$('btn-login').onclick = async () => {
  SFX.button();
  const u = $('auth-user').value.trim();
  const p = $('auth-pass').value;
  if (!u || !p) { $('auth-status').textContent = 'Enter username and password'; return; }
  const users = load(LS_USERS, {});
  const hash  = await sha256(p);
  if (users[u] && users[u] === hash) {
    currentUser = u; SFX.merge();
    enterGame();
  } else {
    $('auth-status').textContent = 'Invalid username or password';
  }
};

$('btn-register').onclick = async () => {
  SFX.button();
  const u = $('auth-user').value.trim();
  const p = $('auth-pass').value;
  if (!u || !p) { $('auth-status').textContent = 'Enter username and password'; return; }
  const users = load(LS_USERS, {});
  if (users[u]) { $('auth-status').textContent = 'Username already taken'; return; }
  users[u] = await sha256(p);
  save(LS_USERS, users);
  SFX.merge();
  $('auth-status').textContent = '✅ Registered! You can log in now.';
};

$('btn-auth-back').onclick = () => { SFX.button(); show('entry-screen'); };

function enterGame() {
  $('who-label').textContent = '👤 ' + currentUser;
  $('b-save').disabled = false;
  $('b-save').style.opacity = 1;
  show('game-screen');
  // check for saved game
  const saves = load(LS_SAVES, {});
  if (saves[currentUser]) {
    if (load(`g2048_ask_${currentUser}`, true)) {
      const ok = confirm('Found a saved game. Load it?');
      if (ok) { doLoad(); }
      else { init(); }
    } else init();
  } else init();
}

/* ====================================================================
   Game buttons
   ==================================================================== */
$('b-up').onclick     = () => { SFX.button(); move('up');    };
$('b-down').onclick   = () => { SFX.button(); move('down');  };
$('b-left').onclick   = () => { SFX.button(); move('left');  };
$('b-right').onclick  = () => { SFX.button(); move('right'); };
$('b-undo').onclick   = () => { SFX.button(); undo(); };
$('b-restart').onclick= () => { SFX.button(); init(); };
$('b-save').onclick   = () => { SFX.button(); doSave(); };
$('b-load').onclick   = () => { SFX.button(); doLoad(); };
$('b-leaderboard').onclick = () => { SFX.button(); showLeaderboard(); };
$('lb-close').onclick = () => { SFX.button(); $('lb-modal').classList.remove('show'); };
$('ov-btn').onclick   = () => { SFX.button(); init(); };

/* keyboard */
document.addEventListener('keydown', e => {
  if (!$('game-screen').classList.contains('active')) return;
  const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
                w:'up', s:'down', a:'left', d:'right',
                W:'up', S:'down', A:'left', D:'right' };
  if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
});

/* boot: auto-login if cookie exists */
(function boot() {
  const cookies = load(LS_COOKIES, {});
  const token   = sessionStorage.getItem('g2048_session');
  if (token && cookies[token]) {
    currentUser = token;
    $('who-label').textContent = '👤 ' + currentUser;
    show('game-screen'); init();
    return;
  }
  init();  // render initial board even on entry screen (behind it)
})();
</script>
</body>
</html>
