<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048 Game</title>
<style>
/* ===========================================================
   2048 Game — Faithful port of csgrace/2048-game (Java/JavaFx)
   Visual style: clean, white background, classic 2048 colors
   =========================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  background: #FAF8EF;
  color: #776E65;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 16px;
}

/* ---- Header ---- */
.game-title {
  font-size: 2.4rem;
  font-weight: 700;
  color: #776E65;
  margin-bottom: 4px;
}

/* ---- Score Bar (top-right in original) ---- */
.status-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.status-box {
  background: #BBADA0;
  border-radius: 4px;
  padding: 6px 16px;
  text-align: center;
  min-width: 70px;
}
.status-box .label {
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  color: #EEE4DA;
  letter-spacing: 0.5px;
}
.status-box .val {
  font-size: 1.3rem;
  font-weight: 700;
  color: #FFF;
}

/* ---- Main Layout (board + side panel) ---- */
.game-layout {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  flex-wrap: wrap;
  justify-content: center;
}

/* ---- Board ---- */
.board-wrap {
  position: relative;
}
.board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 12px;
  width: 400px;
  height: 400px;
  background: #BBADA0;
  border-radius: 6px;
  padding: 12px;
}

.cell {
  background: rgba(238, 228, 218, 0.35);
  border-radius: 4px;
}

/* ---- Tiles ---- */
.tile-overlay {
  position: absolute;
  top: 12px; left: 12px; right: 12px; bottom: 12px;
  pointer-events: none;
}
.tile {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  border-radius: 4px;
  transition: top 0.13s ease, left 0.13s ease;
  background: #EEE4DA;
  color: #776E65;
}
.tile.appear { animation: appear 0.18s ease; }
@keyframes appear {
  0%   { transform: scale(0); }
  100% { transform: scale(1); }
}
/* Classic 2048 palette matching original */
.tile.v2     { background:#EEE4DA; color:#776E65; }
.tile.v4     { background:#EDE0C8; color:#776E65; }
.tile.v8     { background:#F2B179; color:#F9F6F2; }
.tile.v16    { background:#F59563; color:#F9F6F2; }
.tile.v32    { background:#F67C5F; color:#F9F6F2; }
.tile.v64    { background:#F65E3B; color:#F9F6F2; }
.tile.v128   { background:#EDCF72; color:#F9F6F2; }
.tile.v256   { background:#EDCC61; color:#F9F6F2; }
.tile.v512   { background:#EDC850; color:#F9F6F2; }
.tile.v1024  { background:#EDC53F; color:#F9F6F2; }
.tile.v2048  { background:#EDC22E; color:#F9F6F2; }
.tile.vsuper { background:#3C3A32; color:#F9F6F2; }

/* ---- Overlay (Game Over / Win) ---- */
.overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(238, 228, 218, 0.73);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s;
  z-index: 10;
}
.overlay.show { opacity: 1; pointer-events: auto; }
.overlay h2 { font-size: 2.2rem; font-weight: 700; margin-bottom: 12px; }
.overlay.win h2 { color: #F65E3B; }
.overlay.lose h2 { color: #776E65; }

/* ---- Controls Panel (right side) ---- */
.controls-panel {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px 20px;
  border-radius: 4px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: background 0.2s;
  color: #F9F6F2;
  min-width: 120px;
}
.btn-restart { background: #8F7A66; }
.btn-restart:hover { background: #776E65; }
.btn-dir { background: #8F7A66; }
.btn-dir:hover { background: #776E65; }
.btn-action { background: #BBADA0; color: #F9F6F2; }
.btn-action:hover { background: #8F7A66; }

/* Directional pad */
.dir-pad {
  display: grid;
  grid-template-areas:
    ". up ."
    "left . right"
    ". down .";
  gap: 6px;
}
.dir-pad .up    { grid-area: up; }
.dir-pad .down  { grid-area: down; }
.dir-pad .left  { grid-area: left; }
.dir-pad .right { grid-area: right; }

/* Responsive */
@media (max-width: 600px) {
  .board { width: min(86vw, 340px); height: min(86vw, 340px); gap: 8px; padding: 8px; }
  .tile-overlay { top:8px; left:8px; right:8px; bottom:8px; }
  .game-layout { flex-direction: column; align-items: center; }
  .controls-panel { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .dir-pad { order: -1; }
  .btn { min-width: 80px; padding: 8px 14px; font-size: 0.85rem; }
}
</style>
</head>
<body>

<!-- Title -->
<h1 class="game-title">2048</h1>

<!-- Score / Step / Time -->
<div class="status-bar">
  <div class="status-box"><div class="label">Score</div><div class="val" id="score">0</div></div>
  <div class="status-box"><div class="label">Best</div><div class="val" id="best">0</div></div>
  <div class="status-box"><div class="label">Step</div><div class="val" id="step">0</div></div>
  <div class="status-box"><div class="label">Time</div><div class="val" id="time">00:00</div></div>
</div>

<!-- Game Layout -->
<div class="game-layout">

  <!-- Board -->
  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board">
      <!-- 16 background cells injected by JS -->
    </div>
    <div class="tile-overlay" id="tileLayer"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle"></h2>
      <button class="btn btn-restart" id="overlayBtn">Try Again</button>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-panel">
    <button class="btn btn-restart" id="btnRestart">Restart</button>
    <div class="dir-pad">
      <button class="btn btn-dir up"    id="btnUp">&uarr;</button>
      <button class="btn btn-dir left"  id="btnLeft">&larr;</button>
      <button class="btn btn-dir right" id="btnRight">&rarr;</button>
      <button class="btn btn-dir down"  id="btnDown">&darr;</button>
    </div>
    <button class="btn btn-action" id="btnUndo">Undo</button>
    <button class="btn btn-action" id="btnLoad">Load</button>
  </div>

</div>

<script>
(function () {
  "use strict";

  /* ---------- State ---------- */
  var SIZE = 4;
  var grid, score, best, step, won, over, keepPlaying, history;

  /* ---------- DOM ---------- */
  var board      = document.getElementById("board");
  var tileLayer  = document.getElementById("tileLayer");
  var scoreEl    = document.getElementById("score");
  var bestEl     = document.getElementById("best");
  var stepEl     = document.getElementById("step");
  var timeEl     = document.getElementById("time");
  var overlay    = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlayTitle");
  var overlayBtn = document.getElementById("overlayBtn");

  /* ---------- Init ---------- */
  function init() {
    for (var i = 0; i < SIZE * SIZE; i++) {
      var cell = document.createElement("div");
      cell.className = "cell";
      board.appendChild(cell);
    }
    best = parseInt(localStorage.getItem("g2048_best") || "0", 10);
    bestEl.textContent = best;

    document.getElementById("btnRestart").addEventListener("click", restart);
    document.getElementById("btnUndo").addEventListener("click", undo);
    document.getElementById("btnLoad").addEventListener("click", load);
    document.getElementById("btnUp").addEventListener("click",    function () { move("up"); });
    document.getElementById("btnDown").addEventListener("click",  function () { move("down"); });
    document.getElementById("btnLeft").addEventListener("click",  function () { move("left"); });
    document.getElementById("btnRight").addEventListener("click", function () { move("right"); });
    overlayBtn.addEventListener("click", function () {
      if (won && !keepPlaying) { keepPlaying = true; overlay.classList.remove("show"); }
      else restart();
    });

    bindInput();
    restart();
  }

  /* ---------- Restart ---------- */
  function restart() {
    grid = [];
    for (var r = 0; r < SIZE; r++) { grid.push([0, 0, 0, 0]); }
    score = 0; step = 0; won = false; over = false; keepPlaying = false; history = [];
    addRandom(); addRandom();
    render(true);
    updateDisplay();
    overlay.classList.remove("show");
  }

  /* ---------- Random Tile ---------- */
  function addRandom() {
    var empty = [];
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) empty.push({ r: r, c: c });
    if (!empty.length) return;
    var pick = empty[Math.floor(Math.random() * empty.length)];
    grid[pick.r][pick.c] = Math.random() < 0.9 ? 2 : 4;
  }

  /* ---------- Render ---------- */
  function render(fresh) {
    tileLayer.innerHTML = "";
    var cellGap = 12, pad = 12;
    var boardEl = board;
    var bw = boardEl.offsetWidth;
    var cellSz = (bw - pad * 2 - cellGap * (SIZE - 1)) / SIZE;

    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (!grid[r][c]) continue;
        var v = grid[r][c];
        var t = document.createElement("div");
        var cls = v > 2048 ? "vsuper" : "v" + v;
        t.className = "tile " + cls;
        if (fresh) t.className += " appear";
        t.textContent = v;
        t.style.width = cellSz + "px";
        t.style.height = cellSz + "px";
        t.style.lineHeight = cellSz + "px";
        t.style.fontSize = (v < 100 ? "2.4rem" : v < 1000 ? "1.8rem" : "1.3rem");
        t.style.left = (pad + c * (cellSz + cellGap)) + "px";
        t.style.top  = (pad + r * (cellSz + cellGap)) + "px";
        tileLayer.appendChild(t);
      }
    }
  }

  /* ---------- Update Display ---------- */
  function updateDisplay() {
    scoreEl.textContent = score;
    stepEl.textContent = step;
    if (score > best) {
      best = score;
      localStorage.setItem("g2048_best", best);
    }
    bestEl.textContent = best;
  }

  /* ---------- Slide a row left ---------- */
  function slide(row) {
    var a = [];
    for (var i = 0; i < row.length; i++) if (row[i]) a.push(row[i]);
    for (var j = 0; j < a.length - 1; j++) {
      if (a[j] === a[j + 1]) {
        a[j] *= 2;
        score += a[j];
        if (a[j] === 2048 && !won) won = true;
        a.splice(j + 1, 1);
      }
    }
    while (a.length < SIZE) a.push(0);
    return a;
  }

  /* ---------- Move ---------- */
  function move(dir) {
    if (over || (won && !keepPlaying)) return;

    var prev = [];
    for (var r = 0; r < SIZE; r++) prev.push(grid[r].slice());
    var prevScore = score;
    var prevStep = step;
    var moved = false;

    if (dir === "left") {
      for (var r = 0; r < SIZE; r++) {
        var nr = slide(grid[r]);
        for (var c = 0; c < SIZE; c++) if (nr[c] !== grid[r][c]) moved = true;
        grid[r] = nr;
      }
    } else if (dir === "right") {
      for (var r = 0; r < SIZE; r++) {
        var rev = grid[r].slice().reverse();
        var merged = slide(rev).reverse();
        for (var c = 0; c < SIZE; c++) if (merged[c] !== grid[r][c]) moved = true;
        grid[r] = merged;
      }
    } else if (dir === "up") {
      for (var c = 0; c < SIZE; c++) {
        var col = [];
        for (var r = 0; r < SIZE; r++) col.push(grid[r][c]);
        var nc = slide(col);
        for (var r = 0; r < SIZE; r++) if (nc[r] !== grid[r][c]) moved = true;
        for (var r = 0; r < SIZE; r++) grid[r][c] = nc[r];
      }
    } else if (dir === "down") {
      for (var c = 0; c < SIZE; c++) {
        var col = [];
        for (var r = SIZE - 1; r >= 0; r--) col.push(grid[r][c]);
        var nc = slide(col);
        for (var r2 = SIZE - 1; r2 >= 0; r2--)
          if (nc[SIZE - 1 - r2] !== grid[r2][c]) moved = true;
        for (var r2 = SIZE - 1; r2 >= 0; r2--)
          grid[r2][c] = nc[SIZE - 1 - r2];
      }
    }

    if (moved) {
      history.push({ g: prev, s: score, st: prevStep });
      if (history.length > 50) history.shift();
      step++;
      addRandom();
      render(false);
      updateDisplay();
      if (won && !keepPlaying) setTimeout(showOverlay, 300, "win");
      else if (isGameOver()) { over = true; setTimeout(showOverlay, 300, "lose"); }
    }
  }

  /* ---------- Game Over Check ---------- */
  function isGameOver() {
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++) {
        if (!grid[r][c]) return false;
        if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return false;
        if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return false;
      }
    return true;
  }

  /* ---------- Undo ---------- */
  function undo() {
    if (!history.length) return;
    var p = history.pop();
    grid = p.g;
    score = p.s;
    step = p.st;
    over = false; won = false;
    render(true);
    updateDisplay();
    overlay.classList.remove("show");
  }

  /* ---------- Load ---------- */
  function load() {
    var input = prompt("Input path:", "");
    if (input) { console.log("Load path:", input); }
  }

  /* ---------- Overlay ---------- */
  function showOverlay(type) {
    if (type === "win") {
      overlayTitle.textContent = "You Win!";
      overlay.className = "overlay win show";
      overlayBtn.textContent = "Keep Playing";
    } else {
      overlayTitle.textContent = "Game Over";
      overlay.className = "overlay lose show";
      overlayBtn.textContent = "Try Again";
    }
  }

  /* ---------- Input: Keyboard ---------- */
  function bindInput() {
    document.addEventListener("keydown", function (e) {
      var map = {
        ArrowLeft: "left", a: "left", A: "left",
        ArrowRight: "right", d: "right", D: "right",
        ArrowUp: "up", w: "up", W: "up",
        ArrowDown: "down", s: "down", S: "down"
      };
      if (map[e.key]) { move(map[e.key]); e.preventDefault(); }
      if (e.key === "z" || e.key === "Z") undo();
      if (e.key === "r" || e.key === "R") restart();
    });

    /* ---------- Input: Touch ---------- */
    var sx, sy;
    board.addEventListener("touchstart", function (e) {
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    }, { passive: true });
    board.addEventListener("touchend", function (e) {
      var dx = e.changedTouches[0].clientX - sx;
      var dy = e.changedTouches[0].clientY - sy;
      var ax = Math.abs(dx), ay = Math.abs(dy);
      if (Math.max(ax, ay) < 30) return;
      if (ax > ay) move(dx > 0 ? "right" : "left");
      else move(dy > 0 ? "down" : "up");
      e.preventDefault();
    }, { passive: false });
  }

  /* ---------- Start ---------- */
  init();

})();
</script>

</body>
</html>
