<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>2048 · CSGRACE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%230f4c81'/><text x='50%25' y='54%25' font-size='28' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>2</text></svg>">
<style>
  /* ===== design tokens ===== */
  :root{
    --bg:#0b1e33;--panel:#123052;--panel2:#173d66;--line:#275080;
    --txt:#eaf4ff;--mut:#8fb3d9;--gold:#ffd54d;--cta:#0a8cff;--cta2:#0760b0;
    --acc:#ff5e5b;--acc2:#cc3d3b;
    --tile:#1a3a5c;--tile2:#1f4a73;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--bg);color:var(--txt);height:100%;display:flex;align-items:center;justify-content:center;
    overflow:hidden;-webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;border:none;cursor:pointer;font-weight:700}
  input{font-family:inherit;outline:none}
  .card{
    background:linear-gradient(160deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:24px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
    padding:32px;width:min(420px,92vw);text-align:center;
  }
  h1{font-size:36px;letter-spacing:1px;background:linear-gradient(90deg,var(--gold),#fff,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:20px}
  .btn-row{display:flex;gap:12px;margin-top:18px}
  .btn-primary{flex:1;padding:14px;border-radius:14px;background:var(--cta);color:#fff;font-size:16px;transition:background .15s}
  .btn-primary:hover{background:var(--cta2)}
  .btn-ghost{flex:1;padding:14px;border-radius:14px;background:transparent;border:1px solid var(--line);color:var(--txt);font-size:16px}
  .btn-ghost:hover{border-color:var(--cta)}
  .field{display:flex;align-items:center;gap:8px;margin-top:12px}
  .field label{font-size:13px;color:var(--mut);flex:0 0 70px;text-align:left}
  .field select,.field input{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:14px}
  .status{font-size:13px;color:var(--acc);min-height:18px;margin-top:8px}
  .link{color:var(--cta);cursor:pointer;text-decoration:underline}
  /* ===== game screen ===== */
  #game-screen{display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px}
  .top-bar{display:flex;width:min(480px,94vw);justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
  .top-bar .who{font-weight:700;color:var(--gold)}
  .top-bar .mode{background:var(--bg);padding:4px 10px;border-radius:8px;font-size:12px;border:1px solid var(--line)}
  .stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .stat{background:var(--bg);padding:6px 14px;border-radius:10px;font-size:14px;border:1px solid var(--line);min-width:70px}
  .stat .label{font-size:10px;color:var(--mut)}
  .stat .val{font-weight:800;color:var(--gold)}
  /* board container */
  .board-wrap{position:relative}
  .board-bg,.board-fg{position:relative;border-radius:12px;overflow:hidden}
  .board-bg{position:absolute;inset:0}
  #board{position:relative}
  .bg-cell{position:absolute;border-radius:8px}
  .cell{
    position:absolute;display:flex;align-items:center;justify-content:center;
    font-weight:800;border-radius:8px;z-index:2;
    transition:left .15s cubic-bezier(.2,.6,.3,1),top .15s cubic-bezier(.2,.6,.3,1);
    will-change:left,top;
  }
  #board .cell.new{animation:appear .2s ease}
  #board .cell.merging{animation:pop .2s ease .15s both;z-index:3}
  @keyframes appear{0%{transform:scale(0)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.22)}100%{transform:scale(1)}}
  /* controls */
  .controls{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,60px);gap:6px;margin-top:4px}
  .ctrl-btn{border-radius:12px;font-size:22px;background:var(--bg);border:1px solid var(--line);color:var(--txt)}
  .ctrl-btn:hover{border-color:var(--cta)}
  .ctrl-btn:active{background:var(--panel2)}
  .ctrl-up{grid-column:2;grid-row:1}
  .ctrl-left{grid-column:1;grid-row:2}
  .ctrl-down{grid-column:2;grid-row:2}
  .ctrl-right{grid-column:3;grid-row:2}
  .actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .act-btn{padding:8px 14px;border-radius:10px;font-size:12px;background:var(--bg);border:1px solid var(--line);color:var(--txt)}
  .act-btn:hover{border-color:var(--cta)}
  .act-btn:disabled{opacity:.35;pointer-events:none}
  /* overlay */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100}
  .overlay.show{display:flex}
  .overlay-box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px;text-align:center;min-width:260px}
  .overlay-box h2{font-size:32px;margin-bottom:16px}
  .overlay-box .btn-primary{display:inline-block;text-decoration:none;padding:12px 32px;border-radius:14px;background:var(--cta);color:#fff;font-size:16px}
  /* leaderboard modal */
  .lb-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100}
  .lb-modal.show{display:flex}
  .lb-box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;width:min(420px,92vw);max-height:80vh;overflow:auto}
  .lb-box h2{font-size:22px;margin-bottom:4px}
  .lb-box .lb-mode{font-size:13px;color:var(--mut);margin-bottom:12px}
  .lb-box table{width:100%;border-collapse:collapse;font-size:13px}
  .lb-box th,.lb-box td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
  .lb-box th{color:var(--mut);font-weight:600}
  /* grids */
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  /* hide screens by default, show via .active */
  .screen{display:none}
  .screen.active{display:block}
  #game-screen.active{display:flex}
  /* hide game on small screens */
  @media(max-width:480px){
    .card{padding:18px;border-radius:0;width:100vw;min-height:100vh}
    #game-screen{padding:8px;gap:6px}
    .stat{padding:4px 8px;min-width:56px;font-size:12px}
    .controls{grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,50px)}
  }
</style>
</head>
<body>

<!-- ============ ENTRY ============ -->
<div id="entry-screen" class="screen active">
  <div class="card">
    <h1>2048</h1>
    <p class="sub">Merge tiles to reach <b id="entry-target">16</b>!</p>
    <div class="btn-row">
      <button class="btn-primary" id="btn-user">👤 User Mode</button>
      <button class="btn-ghost" id="btn-guest">🎮 Play as Guest</button>
    </div>
  </div>
</div>

<!-- ============ AUTH ============ -->
<div id="auth-screen" class="screen">
  <div class="card">
    <h1>2048</h1>
    <p class="sub">User Mode</p>
    <div class="field"><label>Username</label><input id="auth-user" type="text" maxlength="20" placeholder="Enter username"></div>
    <div class="field"><label>Password</label><input id="auth-pass" type="password" placeholder="Enter password"></div>
    <p class="status" id="auth-status"></p>
    <div class="btn-row">
      <button class="btn-primary" id="btn-login">Log In</button>
      <button class="btn-ghost" id="btn-register">Register</button>
    </div>
    <p style="margin-top:12px;font-size:13px"><span class="link" id="btn-auth-back">← Back</span></p>
  </div>
</div>

<!-- ============ SETTINGS ============ -->
<div id="settings-screen" class="screen">
  <div class="card">
    <h1>2048</h1>
    <p class="sub">Choose your game</p>
    <div class="grid-2">
      <div class="field" style="margin:0"><label>Grid</label>
        <select id="sel-grid">
          <option value="4">4 × 4</option>
          <option value="6">6 × 6</option>
          <option value="8">8 × 8</option>
        </select>
      </div>
      <div class="field" style="margin:0"><label>Timer</label>
        <select id="sel-timer">
          <option value="up">⏱ Stopwatch</option>
          <option value="down-60">⏳ 60s</option>
          <option value="down-120">⏳ 120s</option>
          <option value="down-300">⏳ 5 min</option>
        </select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btn-start-game">▶ Start</button>
    </div>
    <p style="margin-top:12px;font-size:13px"><span class="link" id="btn-settings-back">← Back</span></p>
  </div>
</div>

<!-- ============ GAME ============ -->
<div id="game-screen" class="screen">
  <div class="top-bar">
    <span class="who" id="who-label">🎮 Guest</span>
    <span class="mode" id="stat-mode">4 × 4</span>
  </div>
  <div class="stats">
    <div class="stat"><div class="label">TIME</div><div class="val" id="stat-time">0:00</div></div>
    <div class="stat"><div class="label">🏆 SCORE</div><div class="val" id="stat-score">0</div></div>
    <div class="stat"><div class="label">👣 STEPS</div><div class="val" id="stat-steps">0</div></div>
  </div>
  <div class="board-wrap" id="board-wrap">
    <div class="board-bg" id="board-bg"></div>
    <div id="board"></div>
  </div>
  <div class="controls">
    <button class="ctrl-btn ctrl-up" id="b-up">▲</button>
    <button class="ctrl-btn ctrl-left" id="b-left">◀</button>
    <button class="ctrl-btn ctrl-down" id="b-down">▼</button>
    <button class="ctrl-btn ctrl-right" id="b-right">▶</button>
  </div>
  <div class="actions">
    <button class="act-btn" id="b-undo">↩ Undo</button>
    <button class="act-btn" id="b-restart">🔄 Restart</button>
    <button class="act-btn" id="b-save">💾 Save</button>
    <button class="act-btn" id="b-load">📂 Load</button>
    <button class="act-btn" id="b-leaderboard">🏆 Rank</button>
  </div>
</div>

<!-- ============ OVERLAY ============ -->
<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="ov-title">Game Over</h2>
    <a class="btn-primary" id="ov-btn" href="#" style="display:inline-block;text-decoration:none">🔄 Play Again</a>
  </div>
</div>

<!-- ============ LEADERBOARD MODAL ============ -->
<div class="lb-modal" id="lb-modal">
  <div class="lb-box">
    <h2>🏆 Leaderboard</h2>
    <p class="lb-mode" id="lb-mode-label">4 × 4</p>
    <table>
      <thead><tr><th>#</th><th>User</th><th>Score</th><th>Steps</th><th>Time</th></tr></thead>
      <tbody id="lb-body"></tbody>
    </table>
    <div class="btn-row" style="margin-top:16px"><button class="btn-ghost" id="lb-close">✕ Close</button></div>
  </div>
</div>

<script>
function $(id){return document.getElementById(id)}
/* ===== storage helpers ===== */
const LS_USERS='g2048_users',LS_LEADER='g2048_leaderboard',LS_SAVES='g2048_saves';
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v!==null?v:d}catch(e){return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
/* ===== sha256 ===== */
async function sha256(m){const buf=new TextEncoder().encode(m);const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}
/* ===== SFX ===== */
const SFX=(()=>{
  let ctx;
  function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext);if(ctx.state==='suspended')ctx.resume();return ctx}
  function tone(freq,dur,type='sine',vol=.18){
    try{
      const a=ac(),o=a.createOscillator(),g=a.createGain();
      o.type=type;o.frequency.value=freq;g.gain.value=vol;
      o.connect(g);g.connect(a.destination);
      const t=a.currentTime;o.start(t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.stop(t+dur);
    }catch(e){}
  }
  return{
    button:()=>tone(600,.08,'square',.12),
    move:()=>tone(220,.1,'sine',.15),
    merge:()=>{tone(660,.12,'sine',.2);setTimeout(()=>tone(880,.1,'sine',.15),80)},
    lose:()=>{tone(200,.15,'sawtooth',.2);setTimeout(()=>tone(150,.2,'sawtooth',.2),150)},
    win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,'sine',.22),i*120))}
  }
})();
/* ===== tile colors ===== */
const BG=['#1a3a5c','#1a3a5c','#ff5e5b','#ff8a5b','#ffc75b','#ff5e5b','#ff5e5b','#ff5e5b','#ff5e5b','#ff5e5b','#ff5e5b','#ff5e5b','#ff5e5b','#ff5e5b','#ff5e5b','#ff5e5b','#ff5e5b'];
const FG=['#1a3a5c','#1a3a5c','#fff','#fff','#fff','#fff','#fff','#fff','#fff','#0b1e33','#0b1e33','#0b1e33','#0b1e33','#0b1e33','#0b1e33','#0b1e33','#0b1e33'];
function bg(v){return BG[Math.log2(v)]||BG[BG.length-1]||'#0b1e33'}
function fg(v){return FG[Math.log2(v)]||FG[FG.length-1]||'#eaf4ff'}
/* ===== game state ===== */
let board=[];
let tileId=[];      // stable numeric id per cell, 0=empty
let tileMap={};     // id -> {el, value, row, col}
let nextTileId=1;
let boardSize=4;
let SIZE=4;
let score=0,steps=0;
let won=false,over=false;
let currentUser=null;
let timerMode='up';
let startTime=0,elapsedMs=0,countDownTotal=60;
let gameTimerInterval=null;
const MAX_UNDO=30;
let undoStack=[];
/* ===== geometry ===== */
const GAP=12;
function geom(){
  const wrapW=Math.min(window.innerWidth*0.94,480);
  const tilePx=Math.floor((wrapW-GAP*(SIZE+1))/SIZE);
  const boardPx=tilePx*SIZE+GAP*(SIZE+1);
  return {tilePx,boardPx,wrapW};
}
function pos(r,c){
  const {tilePx}=geom();
  return {x:GAP+c*(tilePx+GAP),y:GAP+r*(tilePx+GAP)};
}
/* ===== build board ===== */
function buildBoardDOM(){
  const b=$('board');b.innerHTML='';
  const {tilePx,boardPx}=geom();
  b.style.width=boardPx+'px';b.style.height=boardPx+'px';
  const bg=$('board-bg');bg.innerHTML='';
  bg.style.width=boardPx+'px';bg.style.height=boardPx+'px';
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const d=document.createElement('div');d.className='bg-cell';
    d.style.width=tilePx+'px';d.style.height=tilePx+'px';
    const p=pos(r,c);d.style.left=p.x+'px';d.style.top=p.y+'px';
    d.style.background='rgba(255,255,255,.06)';
    bg.appendChild(d);
  }
}
/* ===== tile factory ===== */
function makeTile(value,r,c,isNew){
  const {tilePx}=geom();
  const d=document.createElement('div');
  d.className='cell'+(isNew?' new':'');
  d.style.width=tilePx+'px';d.style.height=tilePx+'px';
  d.style.fontSize=(tilePx*.38)+'px';
  d.textContent=value;
  d.style.background=bg(value);d.style.color=fg(value);
  const p=pos(r,c);
  d.style.left=p.x+'px';d.style.top=p.y+'px';
  $('board').appendChild(d);
  return d;
}
/* ===== validate & sanitize data ===== */
function isPowerOfTwo(n){return n>0&&(n&(n-1))===0}
function sanitizeBoard(){
  // Remove any OLD-style save data that has corrupted values
  // (this handles saves created during earlier buggy versions)
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const v=board[r][c];
    if(v!==0&&!isPowerOfTwo(v)){
      // Fix: round to nearest power of two, minimum 2
      const corrected=Math.pow(2,Math.max(1,Math.round(Math.log2(v))));
      console.warn('⚠️ Corrected invalid tile value at',r,c,':',v,'->',corrected);
      board[r][c]=corrected;
    }
  }
}
/* ===== timer ===== */
function fmtTime(ms){
  const s=Math.floor(ms/1000);const m=Math.floor(s/60);
  return timerMode==='up'?`${m}:${String(s%60).padStart(2,'0')}`:`${Math.max(0,countDownTotal-s)}s`;
}
function updateTimer(){
  $('stat-time').textContent=fmtTime(elapsedMs);
  if(timerMode!=='up'){
    const remain=countDownTotal-Math.floor(elapsedMs/1000);
    $('stat-time').textContent=Math.max(0,remain)+'s';
  }
}
function startTimer(){
  stopTimer();
  startTime=Date.now();
  elapsedMs=0;
  if(timerMode!=='up'){
    const m=timerMode.match(/down-(\d+)/);
    countDownTotal=m?parseInt(m[1]):60;
  }
  gameTimerInterval=setInterval(()=>{
    if(over)return;
    elapsedMs=Date.now()-startTime;
    updateTimer();
    if(timerMode!=='up'){
      const remain=countDownTotal-Math.floor(elapsedMs/1000);
      if(remain<=0){stopTimer();gameOverByTime();}
    }
  },100);
}
function stopTimer(){if(gameTimerInterval){clearInterval(gameTimerInterval);gameTimerInterval=null}}

/* ------------------------------------------------------------------ game logic */
function emptyCells(){const o=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!board[r][c])o.push([r,c]);return o}

function addRandom(){
  const e=emptyCells();if(!e.length)return;
  const [r,c]=e[Math.floor(Math.random()*e.length)];
  const v=Math.random()<.9?2:4;
  board[r][c]=v;
  const id=nextTileId++;
  tileId[r][c]=id;
  tileMap[id]={el:makeTile(v,r,c,true),value:v,row:r,col:c};
}

function init(size){
  SIZE=size||boardSize;boardSize=SIZE;
  board=Array.from({length:SIZE},()=>Array(SIZE).fill(0));
  score=0;steps=0;won=false;over=false;
  elapsedMs=0;undoStack.length=0;
  // clean up any orphaned tiles
  for(const id in tileMap)if(tileMap[id].el)tileMap[id].el.remove();
  tileMap={};nextTileId=1;
  buildBoardDOM();
  // create initial 2 tiles
  for(let i=0;i<2;i++){
    const e=emptyCells();if(!e.length)break;
    const [r,c]=e[Math.floor(Math.random()*e.length)];
    const v=Math.random()<.9?2:4;
    board[r][c]=v;
    const id=nextTileId++;
    tileId[r][c]=id;
    tileMap[id]={el:makeTile(v,r,c,true),value:v,row:r,col:c};
  }
  render();
  hideOverlay();startTimer();
}

function snapshot(){return{board:board.map(r=>[...r]),tileId:tileId.map(r=>[...r]),score,steps,elapsedMs}}

/* slide a single row-left, tracking tile IDs + merges. returns {line,ids,merged} */
function slideLine(line,ids){
  const nz=[];for(let i=0;i<line.length;i++)if(line[i])nz.push({v:line[i],id:ids[i]});
  const out=[];const outIds=[];const merged=[];
  let i=0;
  while(i<nz.length){
    if(i+1<nz.length&&nz[i].v===nz[i+1].v){
      const newV=nz[i].v*2;
      out.push(newV);
      outIds.push(nz[i].id);          // survivor keeps its id
      merged.push(nz[i+1].id);        // merged-away tile id
      score+=newV;
      i+=2;
    }else{
      out.push(nz[i].v);
      outIds.push(nz[i].id);
      i++;
    }
  }
  while(out.length<SIZE){out.push(0);outIds.push(0);}
  return {line:out,ids:outIds,merged};
}

/* rebuild tileMap row/col from tileId + board, creating el for any new id */
function syncTiles(){
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const id=tileId[r][c];
    if(id){
      if(!tileMap[id]){tileMap[id]={el:makeTile(board[r][c],r,c,false),value:board[r][c],row:r,col:c}}
      else{tileMap[id].row=r;tileMap[id].col=c;}
    }
  }
}

/* helper to get row */
function rowLine(r){return{line:[...board[r]],ids:[...tileId[r]]}}
function rowSet(r,res){for(let c=0;c<SIZE;c++){board[r][c]=res.line[c];tileId[r][c]=res.ids[c]}}
function colLine(c){const l=[],ids=[];for(let r=0;r<SIZE;r++){l.push(board[r][c]);ids.push(tileId[r][c])}return{line:l,ids}}
function colSet(c,res){for(let r=0;r<SIZE;r++){board[r][c]=res.line[r];tileId[r][c]=res.ids[r]}}

function move(dir){
  if(over)return;
  const before=JSON.stringify(board);
  undoStack.push(snapshot());
  if(undoStack.length>MAX_UNDO)undoStack.shift();
  let allMerged=[];
  if(dir==='left')for(let r=0;r<SIZE;r++){const res=slideLine(rowLine(r).line,rowLine(r).ids);allMerged=allMerged.concat(res.merged);rowSet(r,res)}
  if(dir==='right'){
    for(let r=0;r<SIZE;r++){
      const f=rowLine(r);const res=slideLine(f.line.slice().reverse(),f.ids.slice().reverse());
      const rl=res.line.reverse();const ri=res.ids.reverse();rowSet(r,{line:rl,ids:ri});
      allMerged=allMerged.concat(res.merged);
    }
  }
  if(dir==='up')for(let c=0;c<SIZE;c++){const res=slideLine(colLine(c).line,colLine(c).ids);allMerged=allMerged.concat(res.merged);colSet(c,res)}
  if(dir==='down'){
    for(let c=0;c<SIZE;c++){
      const f=colLine(c);const res=slideLine(f.line.slice().reverse(),f.ids.slice().reverse());
      const cl=res.line.reverse();const ci=res.ids.reverse();colSet(c,{line:cl,ids:ci});
      allMerged=allMerged.concat(res.merged);
    }
  }

  if(JSON.stringify(board)!==before){
    steps++;SFX.move();
    syncTiles();          // create any missing tile els, update row/col refs
    render();             // trigger CSS slide
    const mergedCopy=allMerged.slice();
    setTimeout(()=>finalizeRender(mergedCopy),160);  // remove merged tiles after slide
    // add new random tile after animation
    setTimeout(()=>{addRandom();},160);
    if(!won&&board.flat().includes(SIZE*SIZE*2)){
      won=true;SFX.win();
      setTimeout(()=>showOverlay('🎉 You Win!'),200);
    }else if(!hasMoves()){
      over=true;SFX.lose();stopTimer();
      recordScore();
      setTimeout(()=>showOverlay('💀 Game Over'),200);
    }
  }else{
    undoStack.pop();
  }
}

function hasMoves(){
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    if(!board[r][c])return true;
    if(c<SIZE-1&&board[r][c]===board[r][c+1])return true;
    if(r<SIZE-1&&board[r][c]===board[r+1][c])return true;
  }
  return false;
}

function gameOverByTime(){
  if(over)return;
  over=true;SFX.lose();
  recordScore();
  showOverlay('⏰ Time\'s Up!');
}

function undo(){
  if(!undoStack.length){SFX.lose();return}
  const s=undoStack.pop();
  board=s.board.map(r=>[...r]);
  tileId=s.tileId.map(r=>[...r]);
  score=s.score;steps=s.steps;elapsedMs=s.elapsedMs;
  over=false;won=false;
  // rebuild tiles from scratch for undo
  for(const id in tileMap)if(tileMap[id].el)tileMap[id].el.remove();
  tileMap={};
  syncTiles();
  render();SFX.move();startTimer();
}

/* called after slide calcs — updates value/cleanup, triggers merge pop */
function finalizeRender(mergedIds){
  // remove tiles that were merged into others (slide-finished)
  for(const id of mergedIds){
    const t=tileMap[id];
    if(t){t.el.remove();delete tileMap[id];}
  }
  // update merged tile values + pop anim
  for(const id in tileMap){
    const t=tileMap[id];
    const v=board[t.row][t.col];
    if(!isPowerOfTwo(v)&&v!==0){
      // Safety: correct if somehow invalid
      const corrected=Math.pow(2,Math.max(1,Math.round(Math.log2(v))));
      board[t.row][t.col]=corrected;
      t.value=corrected;
      t.el.textContent=corrected;
      t.el.style.background=bg(corrected);t.el.style.color=fg(corrected);
    }else if(t.value!==v){
      t.value=v;t.el.textContent=v;
      t.el.style.background=bg(v);t.el.style.color=fg(v);
      t.el.classList.remove('merging');void t.el.offsetWidth;t.el.classList.add('merging');
    }
  }
}

/* ------------------------------------------------------------------ per-grid leaderboard */

function recordScore(){
  if(!currentUser)return;
  const all=load(LS_LEADER,{});
  const key=String(SIZE);
  if(!all[key])all[key]=[];
  all[key].push({user:currentUser,score,steps,duration:elapsedMs,date:Date.now()});
  all[key].sort((a,b)=>b.score-a.score||a.duration-b.duration);
  all[key]=all[key].slice(0,50);
  save(LS_LEADER,all);
}

function showLeaderboard(){
  const all=load(LS_LEADER,{})||{};
  const key=String(SIZE);
  const lb=all[key]||[];
  $('lb-mode-label').textContent=`${SIZE}×${SIZE} Grid · ${timerMode==='up'?'Stopwatch':'Countdown'}`;
  const body=$('lb-body');
  if(!lb.length){
    body.innerHTML='<tr><td colspan="5" style="text-align:center;padding:16px">No scores yet – be the first!</td></tr>';
  }else{
    body.innerHTML=lb.slice(0,15).map((e,i)=>
      `<tr><td>${i+1}</td><td>${escapeHtml(e.user)}</td><td>${e.score}</td><td>${e.steps}</td><td>${fmtTime(e.duration)}</td></tr>`
    ).join('');
  }
  $('lb-modal').classList.add('show');
}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

/* ------------------------------------------------------------------ save / load */

function doSave(){
  if(!currentUser){alert('Saving is only available in User Mode.');return}
  // before saving, sanitize to ensure no invalid values persisted
  sanitizeBoard();
  const saves=load(LS_SAVES,{});
  saves[currentUser]=saves[currentUser]||{};
  saves[currentUser][String(SIZE)]={board:board.map(r=>[...r]),score,steps,elapsedMs,timerMode};
  save(LS_SAVES,saves);
  SFX.merge();alert('✅ Game saved!');
}
function doLoad(){
  if(!currentUser)return;
  const saves=load(LS_SAVES,{})||{};
  const uSaves=saves[currentUser]||{};
  const key=String(SIZE);
  if(!uSaves[key]){alert('No save found for '+SIZE+'×'+SIZE+'.');return}
  const s=uSaves[key];
  board=s.board.map(r=>[...r]);
  score=s.score;steps=s.steps;elapsedMs=s.elapsedMs;
  startTime=Date.now()-elapsedMs;over=false;won=false;undoStack.length=0;
  // REBUILD TILES FROM SCRATCH using sanitizeBoard
  for(const id in tileMap)if(tileMap[id].el)tileMap[id].el.remove();
  tileMap={};nextTileId=1;
  tileId=[];
  // IMPORTANT: assign stable tileId for each non-empty cell
  for(let r=0;r<SIZE;r++){
    tileId[r]=[];
    for(let c=0;c<SIZE;c++){
      const v=board[r][c];
      if(v){
        tileId[r][c]=nextTileId++;
      }else{
        tileId[r][c]=0;
      }
    }
  }
  sanitizeBoard(); // <-- Critical: fixes invalid values from previous versions
  syncTiles();
  render();SFX.merge();startTimer();alert('📂 Game loaded!');
}

/* ------------------------------------------------------------------ overlay */

function showOverlay(t){$('ov-title').textContent=t;$('overlay').classList.add('show')}
function hideOverlay(){$('overlay').classList.remove('show')}

/* ------------------------------------------------------------------ screen switching */

function show(s){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  $(s).classList.add('active');
}

/* ====================================================================
   Flow
   ==================================================================== */
$('btn-user').onclick=()=>{SFX.button();show('auth-screen')};
$('btn-guest').onclick=()=>{SFX.button();currentUser=null;showSettings()};
$('btn-auth-back').onclick=()=>{SFX.button();show('entry-screen')};

$('btn-settings-back').onclick=()=>{SFX.button();
  if(currentUser)show('auth-screen');else show('entry-screen');
};

function showSettings(){
  const last=load('g2048_last_settings',{grid:4,timer:'up'});
  $('sel-grid').value=String(last.grid||4);
  $('sel-timer').value=last.timer||'up';
  show('settings-screen');
}

$('btn-start-game').onclick=()=>{
  SFX.button();
  const g=parseInt($('sel-grid').value);
  const t=$('sel-timer').value;
  boardSize=g;timerMode=t;
  save('g2048_last_settings',{grid:g,timer:t});
  $('who-label').textContent=currentUser?('👤 '+currentUser):'🎮 Guest';
  $('stat-mode').textContent=`${g}×${g}`;
  $('b-save').disabled=!currentUser;
  $('b-save').style.opacity=currentUser?'1':'.35';
  $('b-save').style.pointerEvents=currentUser?'auto':'none';
  $('b-load').disabled=!currentUser;
  $('b-load').style.opacity=currentUser?'1':'.35';
  $('b-load').style.pointerEvents=currentUser?'auto':'none';
  show('game-screen');init(g);
};

/* ====================================================================
   Auth
   ==================================================================== */
$('btn-login').onclick=async()=>{
  SFX.button();
  const u=$('auth-user').value.trim(),p=$('auth-pass').value;
  if(!u||!p){$('auth-status').textContent='Enter username and password';return}
  const users=load(LS_USERS,{});
  const hash=await sha256(p);
  if(users[u]&&users[u]===hash){
    currentUser=u;SFX.merge();showSettings();
  }else{$('auth-status').textContent='Invalid username or password'}
};

$('btn-register').onclick=async()=>{
  SFX.button();
  const u=$('auth-user').value.trim(),p=$('auth-pass').value;
  if(!u||!p){$('auth-status').textContent='Enter username and password';return}
  const users=load(LS_USERS,{});
  if(users[u]){$('auth-status').textContent='Username already taken';return}
  users[u]=await sha256(p);save(LS_USERS,users);
  SFX.merge();$('auth-status').textContent='✅ Registered! You can log in now.';
};

/* ====================================================================
   Game buttons
   ==================================================================== */
$('b-up').onclick=()=>{SFX.button();move('up')};
$('b-down').onclick=()=>{SFX.button();move('down')};
$('b-left').onclick=()=>{SFX.button();move('left')};
$('b-right').onclick=()=>{SFX.button();move('right')};
$('b-undo').onclick=()=>{SFX.button();undo()};
$('b-restart').onclick=()=>{SFX.button();init(boardSize)};
$('b-save').onclick=()=>{SFX.button();doSave()};
$('b-load').onclick=()=>{SFX.button();doLoad()};
$('b-leaderboard').onclick=()=>{SFX.button();showLeaderboard()};
$('lb-close').onclick=()=>{SFX.button();$('lb-modal').classList.remove('show')};
$('ov-btn').onclick=()=>{SFX.button();init(boardSize)};

/* keyboard */
document.addEventListener('keydown',e=>{
  if(!$('game-screen').classList.contains('active'))return;
  const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
    w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
  if(map[e.key]){e.preventDefault();move(map[e.key])}
});
</script>
